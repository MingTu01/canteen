server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 允许上传较大的图片(员工头像/反馈图片),默认 1m 会导致 413
    client_max_body_size 50m;

    # gzip 压缩:显著减小 JS/CSS 传输体积
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 安全相关响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 限制浏览器敏感能力(相机/麦克风/定位等),与终端端配置保持一致
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 内容安全策略:仅允许同源脚本与资源,style 允许内联(Vant 注入内联样式),
    # 图片允许 data:/blob:(图片上传预览与 IndexedDB 缓存),降低 XSS 与数据外带风险
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # HSTS:强制 HTTPS,禁止降级到 HTTP(由前置 Nginx 反代提供 HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 带 hash 的静态资源:长期强缓存(Vite 构建产物文件名含 contenthash)
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html:禁止强缓存,保证发布后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # version.json:禁止缓存(前端版本检测拉取此文件判断是否需要刷新,
    # 微信浏览器对 GET 请求缓存激进,必须显式 no-store 避免拿到旧版本号)
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端写 HttpOnly Cookie 需透传
        proxy_pass_request_headers on;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 上传文件静态资源(后端 /uploads/* 由后端提供,这里透传)
    # 长 30 天缓存,immutable 标识避免重复请求(菜品图片很少变化)
    # 使用 ^~ 前缀匹配,优先级高于上方正则 location(否则 .jpg 会被 try_files =404 截胡)
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # SSE 长连接:H5 也支持(未来扩展用),必须关闭 buffer/cache
    location /api/sse/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
