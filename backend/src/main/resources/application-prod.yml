# 生产环境配置:强制依赖外部注入的环境变量,关闭调试功能
server:
  port: 8080
  # P0-4: 启用 forward-headers,让后端正确识别反代后的真实协议/域名/IP
  # 配合 nginx 的 X-Forwarded-Proto 头,Cookie 的 Secure 标志才能在 HTTPS 反代下生效
  forward-headers-strategy: NATIVE

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:canteen}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY:false}&useSSL=${DB_USESSL:true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 强制连接使用 utf8mb4 字符集,修复中文双重编码问题
    hikari:
      connection-init-sql: SET NAMES utf8mb4

  # Spring Boot 3.x Redis 配置必须位于 spring.data.redis.*(spring.redis.* 已不被识别,勿回加)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    encoding: UTF-8
    # Flyway 迁移用独立用户(需 DDL 权限);未配置 SPRING_FLYWAY_USER 时回退到主数据源用户
    # Docker 部署:docker-compose.yml 注入 SPRING_FLYWAY_USER=root(DDL 权限)
    # 非 Docker 部署:若主数据源用 canteen_app(仅 DML),必须显式设置 SPRING_FLYWAY_USER=root
    user: ${SPRING_FLYWAY_USER:${DB_USERNAME}}
    password: ${SPRING_FLYWAY_PASSWORD:${DB_PASSWORD}}

  # 生产关闭 H2 console
  h2:
    console:
      enabled: false

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产关闭 SQL 日志输出(如需排查可临时取消注释)
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# C2 生产 JWT 密钥强制注入,无默认值
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  # 员工 token 过期时间(默认 30 天)
  employee-expiration: ${JWT_EMPLOYEE_EXPIRATION:2592000000}
  # 终端 token 过期时间(默认 365 天)
  terminal-expiration: ${JWT_TERMINAL_EXPIRATION:31536000000}

logging:
  level:
    com.example.canteen: INFO
    org.springframework: WARN
