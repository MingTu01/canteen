server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 基础安全头(X86 kiosk 终端,降低 XSS/点击劫持风险)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 上传文件静态资源(后端 /uploads/* 由后端提供,这里透传)
    # 长 30 天缓存,immutable 标识避免重复请求(菜品图片很少变化)
    # 使用 ^~ 前缀匹配,优先级高于正则 location
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # SSE 长连接:必须关闭 buffer/cache,长连接超时放宽到 1 小时
    # access_log off:避免 token(query 参数)被记录到 nginx 访问日志
    location /api/sse/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        access_log off;
    }

    # 其他 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback(hash 路由模式,所有路径都走 index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
