# =============================================================================
# 企业智慧食堂系统 - 生产部署编排(卷映射模式)
# =============================================================================
# 设计要点:
#   1. 所有服务使用官方基础镜像,不打包业务代码 → 更新时无需重建镜像
#   2. 业务产物(jar/dist/nginx.conf)通过卷映射挂入容器 → 替换文件 + 重启即可
#   3. 持久化数据(MySQL/Redis/uploads/backup)全部映射到宿主机
#   4. 日志轮转 50m × 3,避免 Docker json-file 撑爆磁盘
#   5. X86 终端不参与 Docker 部署,在 Windows 上打包为独立 EXE 安装包
#      (详见 src-python/installer.iss 与 src-python/build_installer.py)
# =============================================================================
#
# 目录结构(由 deploy.sh / scripts/build.sh 自动创建):
#   deploy/
#   ├── backend/app.jar                 # 后端产物
#   ├── admin-web/{html,nginx.conf}     # 管理后台产物
#   └── h5/{html,nginx.conf}            # H5 产物
#
# 更新流程(不重建镜像):
#   ./scripts/build.sh   # 重新构建产物到 deploy/
#   docker compose restart backend admin-web h5
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: canteen-mysql
    restart: always
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: canteen
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
      # P1-3: 应用专用用户(可选,配置后 init-db-user.sh 自动创建)
      DB_APP_USERNAME: ${DB_APP_USERNAME:-}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup:/backup
      # 注:init-db-user.sh 不挂载到 docker-entrypoint-initdb.d/
      # 因为该脚本通过 docker exec 操作 MySQL(宿主机执行),容器内无 docker 命令
      # init-db-user.sh 由 deploy.sh 的 start_services() 在 MySQL healthy 后调用
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?必须配置 MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canteen-net

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: canteen-redis
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    # P1-4 安全修复:Redis 强制密码 + 禁用危险命令
    command: >
      sh -c "redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass $${REDIS_PASSWORD:?必须配置 REDIS_PASSWORD}
      --rename-command FLUSHALL \"\"
      --rename-command FLUSHDB \"\"
      --rename-command CONFIG \"\""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须配置 REDIS_PASSWORD}
    healthcheck:
      # P1-4:带密码的 ping 检查
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - canteen-net

  # ---------- 后端 Spring Boot ----------
  # 使用基础 JRE 镜像,app.jar 通过卷映射挂入
  # 更新后端:./scripts/build.sh backend && docker compose restart backend
  backend:
    # 运行时基础镜像:仅含 JRE + curl,首次部署构建一次,后续更新无需重建
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    image: canteen-backend-runtime:latest
    container_name: canteen-backend
    restart: always
    logging: *default-logging
    # P1-5 非 root 降权:用 PUID/PGID 动态指定运行用户(与宿主机用户 UID 对齐)
    # 由 deploy.sh 自动检测 SUDO_USER 的 UID/GID 写入 .env,默认 1000
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/canteen?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:-${MYSQL_ROOT_PASSWORD:?必须配置 MYSQL_ROOT_PASSWORD}}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: canteen
      DB_USERNAME: ${DB_APP_USERNAME:-root}
      DB_PASSWORD: ${DB_APP_PASSWORD:-${MYSQL_ROOT_PASSWORD:?必须配置 MYSQL_ROOT_PASSWORD}}
      DB_ALLOW_PUBLIC_KEY: "true"
      DB_USESSL: "false"
      # P1-3: Flyway 迁移用 root,运行时用 canteen_app(若配置了 DB_APP_USERNAME)
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:-root}
      SPRING_FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须配置 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # P1-4: Redis 密码(强制配置)
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须配置 REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?必须配置 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_EMPLOYEE_EXPIRATION: ${JWT_EMPLOYEE_EXPIRATION:-2592000000}
      JWT_TERMINAL_EXPIRATION: ${JWT_TERMINAL_EXPIRATION:-31536000000}
      BACKUP_DIR: /app/backup
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      # 初始超管账号(可选,首次部署时由 AdminInitializer 读取)
      # 不设置则使用默认 admin/123456
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      INIT_ADMIN_FORCE: ${INIT_ADMIN_FORCE:-}
      # 微信公众号登录(可选,配置后 H5 微信浏览器内可一键登录)
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # 微信公众号模板消息推送(可选,配置后通知发布/下单成功时推送)
      WECHAT_TEMPLATE_NOTIFY: ${WECHAT_TEMPLATE_NOTIFY:-}
      WECHAT_TEMPLATE_ORDER: ${WECHAT_TEMPLATE_ORDER:-}
      WECHAT_H5_BASE_URL: ${WECHAT_H5_BASE_URL:-}
      # P0-5: CORS 允许的 Origin 白名单(逗号分隔,空则使用默认内网规则)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # P1-1: 后端备份加密密钥(可选,配置后 Java 端备份自动加密)
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    ports:
      # P0-1 安全修复:绑定 127.0.0.1,仅允许本机访问
      # 外部访问必须通过 1panel/Nginx 反向代理,杜绝绕过反代直接暴露
      # 宿主机端口 18082(不常用端口,避免与 nginx 等冲突)
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/api/system/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      # 业务产物:jar 通过卷映射,更新只需替换文件 + 重启
      - ./deploy/backend/app.jar:/app/app.jar:ro
      # 持久化目录
      - ./backup:/app/backup
      - ./uploads:/app/uploads
    networks:
      - canteen-net

  # ---------- 管理后台前端 ----------
  # 使用基础 nginx 镜像,dist + nginx.conf 通过卷映射挂入
  # 更新前端:./scripts/build.sh admin-web && docker compose restart admin-web
  admin-web:
    image: nginx:alpine
    container_name: canteen-admin
    restart: always
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # P0-1 安全修复:绑定 127.0.0.1,仅允许本机访问
      # 宿主机端口 18080(不常用端口,避免与系统 nginx/apache 80 端口冲突)
      - "127.0.0.1:18080:80"
    volumes:
      - ./deploy/admin-web/html:/usr/share/nginx/html:ro
      - ./deploy/admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - canteen-net

  # ---------- H5 订餐端 ----------
  h5:
    image: nginx:alpine
    container_name: canteen-h5
    restart: always
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # P0-1 安全修复:绑定 127.0.0.1,仅允许本机访问
      # 宿主机端口 18081(不常用端口,避免冲突)
      - "127.0.0.1:18081:80"
    volumes:
      - ./deploy/h5/html:/usr/share/nginx/html:ro
      - ./deploy/h5/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - canteen-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  canteen-net:
    driver: bridge
