# =============================================================================
# 企业智慧食堂系统 - 生产部署编排(卷映射模式)
# =============================================================================
# 设计要点:
#   1. 所有服务使用官方基础镜像,不打包业务代码 → 更新时无需重建镜像
#   2. 业务产物(jar/dist/nginx.conf)通过卷映射挂入容器 → 替换文件 + 重启即可
#   3. 持久化数据(MySQL/Redis/uploads/backup)全部映射到宿主机
#   4. 日志轮转 50m × 3,避免 Docker json-file 撑爆磁盘
# =============================================================================
#
# 目录结构(由 deploy.sh / scripts/build.sh 自动创建):
#   deploy/
#   ├── backend/app.jar                 # 后端产物
#   ├── admin-web/{html,nginx.conf}     # 管理后台产物
#   ├── h5/{html,nginx.conf}            # H5 产物
#   └── terminal/{html,nginx.conf}      # 终端产物
#
# 更新流程(不重建镜像):
#   ./scripts/build.sh   # 重新构建产物到 deploy/
#   docker compose restart backend admin-web h5 terminal
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: canteen-mysql
    restart: always
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-canteen2026}
      MYSQL_DATABASE: canteen
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup:/backup
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-canteen2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canteen-net

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: canteen-redis
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - canteen-net

  # ---------- 后端 Spring Boot ----------
  # 使用基础 JRE 镜像,app.jar 通过卷映射挂入
  # 更新后端:./scripts/build.sh backend && docker compose restart backend
  backend:
    # 运行时基础镜像:仅含 JRE + curl,首次部署构建一次,后续更新无需重建
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    image: canteen-backend-runtime:latest
    container_name: canteen-backend
    restart: always
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/canteen?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-canteen2026}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: canteen
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-canteen2026}
      DB_ALLOW_PUBLIC_KEY: "true"
      DB_USESSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-canteen-jwt-secret-key-2026-please-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_EMPLOYEE_EXPIRATION: ${JWT_EMPLOYEE_EXPIRATION:-2592000000}
      JWT_TERMINAL_EXPIRATION: ${JWT_TERMINAL_EXPIRATION:-31536000000}
      BACKUP_DIR: /app/backup
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
    ports:
      # 绑定 0.0.0.0 让局域网 X86 终端可访问
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/api/system/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      # 业务产物:jar 通过卷映射,更新只需替换文件 + 重启
      - ./deploy/backend/app.jar:/app/app.jar:ro
      # 持久化目录
      - ./backup:/app/backup
      - ./uploads:/app/uploads
    networks:
      - canteen-net

  # ---------- 管理后台前端 ----------
  # 使用基础 nginx 镜像,dist + nginx.conf 通过卷映射挂入
  # 更新前端:./scripts/build.sh admin-web && docker compose restart admin-web
  admin-web:
    image: nginx:alpine
    container_name: canteen-admin
    restart: always
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/admin-web/html:/usr/share/nginx/html:ro
      - ./deploy/admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - canteen-net

  # ---------- H5 订餐端 ----------
  h5:
    image: nginx:alpine
    container_name: canteen-h5
    restart: always
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "81:80"
    volumes:
      - ./deploy/h5/html:/usr/share/nginx/html:ro
      - ./deploy/h5/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - canteen-net

  # ---------- X86 终端前端 ----------
  terminal:
    image: nginx:alpine
    container_name: canteen-terminal
    restart: always
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "82:80"
    volumes:
      - ./deploy/terminal/html:/usr/share/nginx/html:ro
      - ./deploy/terminal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - canteen-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  canteen-net:
    driver: bridge
